name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build

  release:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:release
      - run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Promote latest release tag for Nix
        shell: bash
        run: |
          git fetch origin --tags --quiet
          release_tag=""
          while IFS= read -r candidate; do
            if [[ "$candidate" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              release_tag="$candidate"
              break
            fi
          done < <(git for-each-ref --merged="$GITHUB_SHA" --sort=-version:refname --format='%(refname:short)' refs/tags)
          if [[ -z "$release_tag" ]]; then
            echo "::error::No stable release tag is reachable from $GITHUB_SHA"
            exit 1
          fi
          release_commit="$(git rev-parse "${release_tag}^{commit}")"
          git push origin "${release_commit}:refs/heads/nix-release"
